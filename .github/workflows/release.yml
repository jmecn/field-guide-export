name: Release jar

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Restore Gradle caches (MDG / NeoForge / deps)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: fge-gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: |
            fge-gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish to GitHub Packages
        run: |
          chmod +x gradlew
          VER="${GITHUB_REF_NAME#v}"
          ./gradlew jar publish --no-daemon --build-cache -Pmod_version="$VER"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/field-guide-export-*.jar
          generate_release_notes: true
