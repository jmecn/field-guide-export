plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge'
    id 'maven-publish'
}

group = group_id
version = mod_version

base {
    archivesName = archives_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'GitHubPackagesMinecraftWebExport'
        url = uri("https://maven.pkg.github.com/jmecn/minecraft-web-export")
        credentials {
            username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.1'

    compileOnly("maven.modrinth:patchouli:${patchouli_version}") { transitive = false }
    modCompileOnly("maven.modrinth:patchouli:${patchouli_version}") { transitive = false }
    modRuntimeOnly("maven.modrinth:patchouli:${patchouli_version}") { transitive = false }

    modCompileOnly "io.github.jmecn:minecraft-web-export:${mwe_version}"
    modRuntimeOnly "io.github.jmecn:minecraft-web-export:${mwe_version}"
    modCompileOnly "dev.emi:emi-forge:${emi_version}"
    modRuntimeOnly "dev.emi:emi-forge:${emi_version}"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    mods {
        field_guide_export {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'INFO'
        }
        client {
            client()
        }
        exportClient {
            client()
            ideName = 'Guide Export Client'
            systemProperty 'fieldguide.exportFolder', 'build/guide-export'
            systemProperty 'fieldguide.exportEmi', 'false'
        }
        exportCiClient {
            client()
            ideName = 'Export CI Client'
            systemProperty 'minecraftWebExport.runExportAndExit', 'true'
            systemProperty 'minecraftWebExport.export.outputDir', 'build/export'
            systemProperty 'minecraftWebExport.exportWorldName', 'emi-export'
            systemProperty 'minecraftWebExport.exportMode', 'scoped'
            systemProperty 'minecraftWebExport.export.enabled', 'true'
            systemProperty 'minecraftWebExport.exportWarmupTicks', '100'
            systemProperty 'minecraftWebExport.exportWorldDelayTicks', '60'
            systemProperty 'minecraftWebExport.exportTimeoutSeconds', '7200'
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    def resourceProps = [
            minecraft_version: minecraft_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
            mod_id           : mod_id,
            mod_license      : mod_license,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mwe_version      : mwe_version,
    ]
    inputs.properties(resourceProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(resourceProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = group_id
            artifactId = archives_name
            version = mod_version
            artifact(tasks.jar)
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/jmecn/field-guide-export")
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
